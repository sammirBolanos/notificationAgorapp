spring.application.name=notification-agorapp
server.port=${SERVER_PORT:8082}

# Configuración base (Neon/PostgreSQL) usando variables de entorno
spring.datasource.url=${DB_URL:jdbc:postgresql://your-neon-host.neon.tech/neondb?sslmode=require}
spring.datasource.username=${DB_USERNAME:neondb_owner}
spring.datasource.password=${DB_PASSWORD:change-me}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
